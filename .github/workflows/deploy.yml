name: Deploy Student Task Manager (Terraform)

on:
  push:
    branches: [main]
    paths: ["terraform/**", "application/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_workers_subdomain: ${{ vars.WORKERS_SUBDOMAIN }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}   # HCP Terraform (remote state)

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # Apply only on pushes to main (not on pull requests)
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform output
